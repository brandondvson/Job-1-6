<<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WartaKini — Portal Berita Terkini</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <a href="#" class="brand" id="resetHome">Warta<span>Kini</span></a>
            <p class="date-label" id="currentDate"></p>
        </div>
    </header>

    <nav class="nav-bar" aria-label="Kategori Berita">
        <div class="container nav-inner">
            <div class="category-list" id="categoryList">
                <button type="button" class="cat-btn is-active" data-category="all">Semua</button>
                <button type="button" class="cat-btn" data-category="teknologi">Teknologi</button>
                <button type="button" class="cat-btn" data-category="pendidikan">Pendidikan</button>
                <button type="button" class="cat-btn" data-category="otomotif">Otomotif</button>
                <button type="button" class="cat-btn" data-category="gaya-hidup">Gaya Hidup</button>
            </div>
            <div class="search-box">
                <input type="search" id="searchInput" placeholder="Cari berita..." aria-label="Cari berita">
            </div>
        </div>
    </nav>

    <main class="container main-content">
        <section class="headline-banner" id="headlineBanner" aria-label="Berita Utama"></section>

        <section aria-label="Daftar Berita">
            <div class="section-header">
                <h2 id="sectionTitle">Berita Terbaru</h2>
                <span id="newsCount" class="news-count"></span>
            </div>
            <div class="news-grid" id="newsGrid"></div>
            <p class="empty-state is-hidden" id="emptyState">Tidak ada berita yang cocok dengan filter atau pencarian.</p>
        </section>
    </main>

    <!-- Modal Baca Berita -->
    <div class="modal-backdrop is-hidden" id="articleModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-card">
            <div class="modal-header">
                <span class="badge" id="modalCategory"></span>
                <button type="button" class="close-btn" id="closeModal" aria-label="Tutup artikel">&times;</button>
            </div>
            <h2 id="modalTitle"></h2>
            <p class="modal-meta" id="modalMeta"></p>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 WartaKini. Informasi ringkas, jelas, dan terstruktur.</p>
        </div>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
